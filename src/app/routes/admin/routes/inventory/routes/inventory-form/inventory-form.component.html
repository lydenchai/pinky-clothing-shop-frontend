<h5>{{ isEditMode ? 'Edit Product' : 'Add New Product' }}</h5>
<div class="admin-container scroll-container">
  <div class="form-container content-scroll">
    <form [formGroup]="inventoryForm" (ngSubmit)="onSubmit()">
      <div class="form-row">
        <div class="form-group col">
          <label for="productId">Product ID</label>
          <input id="productId" type="number" formControlName="productId" class="form-control" required>
        </div>
        <div class="form-group col">
          <label for="quantity">Quantity</label>
          <input id="quantity" type="number" formControlName="quantity" class="form-control" required min="0">
        </div>
        <div class="form-group col">
          <label for="location">Location</label>
          <input id="location" type="text" formControlName="location" class="form-control">
        </div>
      </div>
      <div class="form-actions">
        <button type="button" routerLink="/admin/inventory" mat-raised-button color="primary">{{ 'cancel' | translate
          }}</button>
        <button type="submit" mat-raised-button color="primary" [disabled]="loading">
          {{ loading ? ('saving' | translate) : (isEditMode ? ('update' | translate) : ('create' | translate)) }}
        </button>
      </div>
    </form>
  </div>
</div>
