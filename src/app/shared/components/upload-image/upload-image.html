<div class="image-upload" [class.dragover]="dragOver" (dragover)="onDragOver($event)" (dragleave)="onDragLeave($event)"
  (drop)="onDrop($event)">
  <label class="upload-label">
    <span class="upload-icon">📷</span>
    <span class="upload-text">Drag & drop or click to upload</span>
    <input type="file" accept="image/*" (change)="onFileChange($event)" [disabled]="disabled" />
  </label>
  @if (previewUrl) {
  <div class="preview">
    <img [src]="previewUrl" alt="Image preview" />
    <button type="button" class="remove-btn" (click)="removeImage()" title="Remove image">
      ✖
    </button>
  </div>
  }
</div>
