<div class="image-upload" [class.dragover]="dragOver" [class.disabled]="disabled" (dragover)="onDragOver($event)"
  (dragleave)="onDragLeave($event)" (drop)="onDrop($event)">
  <label class="w-full d-flex flex-column align-items-center justify-content-center cursor-pointer user-select-none">
    <span>
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="24" height="24" rx="12" fill="#f5f6fa" />
        <path d="M12 7V17M12 17L8 13M12 17L16 13" stroke="#0071e3" stroke-width="1.5" stroke-linecap="round"
          stroke-linejoin="round" />
      </svg>
    </span>
    <span class="space-x-1">{{ 'drag_and_drop' | translate }}
      <span class="text-[#0071e3] underline">
        {{ 'browse' | translate }}
      </span>
    </span>
    <input type="file" accept="image/*" (change)="onFileChange($event)" [disabled]="disabled" />
  </label>
  @if (previewUrl) {
  <div class="preview">
    <img [src]="previewUrl" alt="Image preview" />
  </div>
  }
</div>
