<div class="admin-container scroll-container">
  <div class="form-container content-scroll form">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <h5 class="text-primary">{{ "general_information" | translate }}</h5>
      <div class="row mt-2">
        <div class="col-12 col-sm-6 col-md-3">
          <app-field-container [label]="'first_name' | translate" [control]="form.controls.first_name">
            <mat-form-field appearance="outline">
              <input matInput name="first_name" [formControl]="form.controls.first_name" />
            </mat-form-field>
          </app-field-container>
        </div>
        <div class="col-12 col-sm-6 col-md-3">
          <app-field-container [label]="'last_name' | translate" [control]="form.controls.last_name">
            <mat-form-field appearance="outline">
              <input matInput name="last_name" [formControl]="form.controls.last_name" />
            </mat-form-field>
          </app-field-container>
        </div>
        <div class="col-12 col-sm-6 col-md-3">
          <app-field-container [label]="'email' | translate" [control]="form.controls.email">
            <mat-form-field appearance="outline">
              <input matInput name="email" [formControl]="form.controls.email" />
            </mat-form-field>
          </app-field-container>
        </div>
        <div class="col-12 col-sm-6 col-md-3">
          <app-field-container [label]="'phone' | translate" [control]="form.controls.phone">
            <ngx-intl-tel-input class="mat-like-phone" [enableAutoCountrySelect]="false" [searchCountryFlag]="true"
              [searchCountryField]="[SearchCountryField.Name, SearchCountryField.Iso2]" [selectFirstCountry]="false"
              [selectedCountryISO]="CountryISO.Cambodia" [phoneValidation]="true"
              [numberFormat]="PhoneNumberFormat.International" [formControl]="form.controls.phone">
            </ngx-intl-tel-input>
          </app-field-container>
        </div>
        <div class="col-12 col-sm-6 col-md-3">
          <app-field-container [label]="'role' | translate" [control]="form.controls.role">
            <mat-form-field appearance="outline">
              <mat-select [formControl]="form.controls.role">
                @for (role of RoleEnum; track $index) {
                <mat-option [value]="role">{{ role | translate }}</mat-option>
                }
              </mat-select>
            </mat-form-field>
          </app-field-container>
        </div>
        @if(!updateId){
        <div class="col-12 col-sm-6 col-md-3">
          <app-field-container [label]="'password' | translate" [control]="form.controls.password">
            <mat-form-field appearance="outline">
              <input matInput name="password" [formControl]="form.controls.password" />
            </mat-form-field>
          </app-field-container>
        </div>
        }
      </div>
      <h5 class="text-primary">{{ "address" | translate }}</h5>
      <div class="row mt-2">
        <div class="col-12 col-sm-6 col-md-3">
          <app-field-container [label]="'street' | translate" [control]="form.controls.address.controls.street">
            <mat-form-field appearance="outline">
              <input matInput name="street" [formControl]="form.controls.address.controls.street" />
            </mat-form-field>
          </app-field-container>
        </div>
        <div class="col-12 col-sm-6 col-md-3">
          <app-field-container [label]="'house' | translate" [control]="form.controls.address.controls.house">
            <mat-form-field appearance="outline">
              <input matInput name="house" [formControl]="form.controls.address.controls.house" />
            </mat-form-field>
          </app-field-container>
        </div>
        <div class="col-12 col-sm-6 col-md-3">
          <app-field-container [label]="'village' | translate" [control]="form.controls.address.controls.village">
            <mat-form-field appearance="outline">
              <input matInput name="village" [formControl]="form.controls.address.controls.village" />
            </mat-form-field>
          </app-field-container>
        </div>
        <div class="col-12 col-sm-6 col-md-3">
          <app-field-container [label]="'commune' | translate" [control]="form.controls.address.controls.commune">
            <mat-form-field appearance="outline">
              <input matInput name="commune" [formControl]="form.controls.address.controls.commune" />
            </mat-form-field>
          </app-field-container>
        </div>
        <div class="col-12 col-sm-6 col-md-3">
          <app-field-container [label]="'district' | translate" [control]="form.controls.address.controls.district">
            <mat-form-field appearance="outline">
              <input matInput name="district" [formControl]="form.controls.address.controls.district" />
            </mat-form-field>
          </app-field-container>
        </div>
        <div class="col-12 col-sm-6 col-md-3">
          <app-field-container [label]="'province' | translate" [control]="form.controls.address.controls.province">
            <mat-form-field appearance="outline">
              <input matInput name="province" [formControl]="form.controls.address.controls.province" />
            </mat-form-field>
          </app-field-container>
        </div>
        <div class="col-12 col-sm-6 col-md-3">
          <app-field-container [label]="'country' | translate" [control]="form.controls.address.controls.country">
            <mat-form-field appearance="outline">
              <input matInput name="country" [formControl]="form.controls.address.controls.country" />
            </mat-form-field>
          </app-field-container>
        </div>
      </div>
    </form>
  </div>
  <div class="form-actions">
    <button type="button" routerLink="/admin/users" mat-raised-button color="primary" class="cancel">
      <mat-icon>cancel</mat-icon>{{ 'cancel' | translate }}
    </button>
    <button mat-raised-button color="primary" class="save" (click)="onSubmit()">
      <mat-icon>save</mat-icon>{{ (updateId ? ('update' | translate) : ('create' | translate)) }}
    </button>
  </div>
</div>
