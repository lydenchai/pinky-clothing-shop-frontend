<h5>
  {{ isEditMode ? ('_update' | translate : { param: ('user' | translate) }) : ('_create' | translate : {param: ('user' |
  translate) } )}}
</h5>
<div class="admin-container scroll-container">
  <div class="form-container content-scroll form">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      @if(backendError) {
      <div class="alert alert-danger mb-3">{{ backendError }}</div>
      }
      <div class="row mt-2">
        <div class="col-12 col-sm-6 col-md-3">
          <app-field-container [label]="'first_name' | translate" [control]="form.controls.firstName">
            <mat-form-field appearance="outline">
              <input matInput name="firstName" [formControl]="form.controls.firstName" />
            </mat-form-field>
          </app-field-container>
        </div>
        <div class="col-12 col-sm-6 col-md-3">
          <app-field-container [label]="'last_name' | translate" [control]="form.controls.lastName">
            <mat-form-field appearance="outline">
              <input matInput name="lastName" [formControl]="form.controls.lastName" />
            </mat-form-field>
          </app-field-container>
        </div>
        <div class="col-12 col-sm-6 col-md-3">
          <app-field-container [label]="'phone' | translate" [control]="form.controls.phone">
            <mat-form-field appearance="outline">
              <input matInput name="phone" [formControl]="form.controls.phone" />
            </mat-form-field>
          </app-field-container>
        </div>
        <div class="col-12 col-sm-6 col-md-3">
          <app-field-container [label]="'address' | translate" [control]="form.controls.address">
            <mat-form-field appearance="outline">
              <input matInput name="address" [formControl]="form.controls.address" />
            </mat-form-field>
          </app-field-container>
        </div>
        <div class="col-12 col-sm-6 col-md-3">
          <app-field-container [label]="'role' | translate" [control]="form.controls.role">
            <mat-form-field appearance="outline">
              <mat-select [formControl]="form.controls.role" class="px-2">
                @for (role of RoleEnum; track $index) {
                <mat-option [value]="role">{{ role | translate }}</mat-option>
                }
              </mat-select>
            </mat-form-field>
          </app-field-container>
        </div>
        @if(!isEditMode){
        <div class="col-12 col-sm-6 col-md-3">
          <app-field-container [label]="'password' | translate" [control]="form.controls.password">
            <mat-form-field appearance="outline">
              <input matInput name="password" [formControl]="form.controls.password" />
            </mat-form-field>
          </app-field-container>
        </div>
        }
      </div>
    </form>
  </div>
  <div class="form-actions">
    <button type="button" routerLink="/admin/users" mat-raised-button color="primary" class="cancel">
      {{ 'cancel' |
      translate }}</button>
    <button type="submit" mat-raised-button color="primary" class="save" [disabled]="loading">
      {{ (isEditMode ? ('update' | translate) : ('create' | translate)) }}
    </button>
  </div>
</div>
