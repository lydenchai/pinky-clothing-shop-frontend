<app-header *ngIf="showDefaultLayout()" />
<main class="main-content">
  <router-outlet />
  <app-footer *ngIf="showDefaultLayout()" />
</main>
<app-dialog />
@if (isLoading()) {
  <div class="app-loading">
    <img src="/imgs/loading.svg" alt="Loading..." />
    <h2>{{ "processing_please_wait" | translate }}</h2>
  </div>
}
